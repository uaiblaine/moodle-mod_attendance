name: ci

# workflow_dispatch is the manual escape hatch: it lets a run be launched for
# a push whose commits would otherwise skip CI, without pushing another commit.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Single reusable-workflow call: the Moodle core branch is auto-detected from
  # this plugin branch's name (MOODLE_501_STABLE), so no moodle-core-branch
  # input is given. Every MOODLE_XX_STABLE branch carries this same single-call
  # form and resolves to its own core branch — keep each branch's own version of
  # this file when resolving cherry-picks.
  ci:
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
